name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest httpx fastapi pandas scikit-learn xgboost joblib duckdb

      - name: Set up dbt and build tables
        run: |
          pip install dbt-core dbt-duckdb
          cd include/dbt_project
          dbt deps
          dbt seed --profiles-dir .
          dbt run --profiles-dir .
          cd ../..

      - name: Train model (needed for API tests)
        run: python3 ml/train_model.py

      - name: Run tests
        run: pytest tests/unit/ -v
