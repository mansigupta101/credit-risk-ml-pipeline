version: 2

models:
  - name: stg_credit_applications
    description: Cleaned credit application data -- fixed dates, normalized income, nulled sentinel scores.
    columns:
      - name: application_id
        description: Unique identifier for each credit application.
        tests:
          - unique
          - not_null

      - name: credit_score
        description: Score 300-850. Sentinel 999 values are nulled here.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 300
                max_value: 850
                inclusive: true
              config:
                where: "credit_score is not null"

      - name: annual_income
        description: Income normalized to an annual figure.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                where: "annual_income is not null"
